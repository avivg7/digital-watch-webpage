<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <!-- Original first-party graphic for the featured-video PLAYER DEMO. It reproduces no broadcast footage, no person and no third-party material.
     Frames are rendered deterministically by scripts/build-demo-video.mjs through window.render(seconds). -->
    <style>
      @font-face {
        font-family: Heebo;
        src: url('../../node_modules/@fontsource-variable/heebo/files/heebo-hebrew-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
        unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
      }
      @font-face {
        font-family: Heebo;
        src: url('../../node_modules/@fontsource-variable/heebo/files/heebo-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #05143f;
        font-family: Heebo, sans-serif;
        color: #e9f0ff;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        background: radial-gradient(60% 80% at 24% 52%, rgba(4, 116, 252, 0.42), transparent 70%), linear-gradient(160deg, #0b1f52, #05143f 70%);
      }
      .badge {
        position: absolute;
        inset-block-start: 34px;
        inset-inline-end: 44px;
        padding: 10px 20px;
        border-radius: 999px;
        border: 2px solid rgba(180, 195, 230, 0.55);
        font-size: 22px;
        font-weight: 600;
        color: #e9f0ff;
        background: rgba(5, 20, 63, 0.7);
      }
      .call {
        position: absolute;
        inset-inline-start: 60px;
        inset-block-start: 140px;
        width: 470px;
        height: 400px;
        border-radius: 26px;
        border: 2px solid rgba(180, 195, 230, 0.35);
        background: linear-gradient(160deg, #142a66, #0b1f52);
        overflow: hidden;
      }
      .call__bar {
        height: 46px;
        display: flex;
        gap: 9px;
        align-items: center;
        padding-inline: 18px;
        border-bottom: 2px solid rgba(180, 195, 230, 0.2);
      }
      .call__bar i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgba(180, 195, 230, 0.45);
      }
      .avatar {
        position: absolute;
        inset-inline-start: 50%;
        inset-block-start: 84px;
        width: 150px;
        height: 150px;
        margin-inline-start: -75px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #3c6fd8, #1f3a82);
      }
      .avatar::after {
        content: '';
        position: absolute;
        inset-inline-start: -45px;
        inset-block-start: 170px;
        width: 240px;
        height: 130px;
        border-radius: 120px 120px 0 0;
        background: #1f3a82;
      }
      .tags {
        position: absolute;
        inset-inline: 0;
        inset-block-end: 26px;
        display: flex;
        justify-content: center;
        gap: 14px;
      }
      .tag {
        position: relative;
        padding: 9px 20px;
        border-radius: 999px;
        font-size: 24px;
        font-weight: 700;
        background: #fd3e4f;
        color: #fff;
        overflow: hidden;
      }
      .tag .cover {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #0474fc, #01aefe);
        transform-origin: right center;
        transform: scaleX(0);
      }
      .ring {
        position: absolute;
        inset-inline-start: 295px;
        inset-block-start: 340px;
        width: 0;
        height: 0;
        border-radius: 50%;
        border: 5px solid #6fd3ff;
        transform: translate(-50%, -50%);
      }
      .emblem {
        position: absolute;
        inset-inline-end: 60px;
        inset-block-start: 480px;
        width: 112px;
        height: 112px;
      }
      .lines {
        position: absolute;
        inset-inline-end: 60px;
        inset-block-start: 150px;
        width: 640px;
        display: grid;
        gap: 16px;
      }
      .ln {
        font-size: 44px;
        line-height: 1.2;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .ln--3 {
        box-shadow: inset 0 -6px 0 #fd3e4f;
        width: fit-content;
        padding-block-end: 4px;
      }
      .sign {
        position: absolute;
        inset-inline-end: 190px;
        inset-block-start: 490px;
        width: 500px;
        font-size: 38px;
        font-weight: 700;
        color: #6fd3ff;
        line-height: 1.3;
      }
      .sign small {
        display: block;
        margin-block-start: 8px;
        font-size: 26px;
        font-weight: 400;
        color: #b4c3e6;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="badge">סרטון הדגמה של הנגן באתר · אינו התחקיר של חדשות 13</div>
      <div class="call">
        <div class="call__bar"><i></i><i></i><i></i></div>
        <div class="avatar"></div>
        <div class="tags">
          <span class="tag" id="t1">מיקום<b class="cover"></b></span><span class="tag" id="t2">ציוד<b class="cover"></b></span
          ><span class="tag" id="t3">פרטים מזהים<b class="cover"></b></span>
        </div>
      </div>
      <div class="ring" id="ring"></div>
      <img class="emblem" id="emblem" src="../../public/img/digital-watch-emblem.webp" alt="" />
      <div class="lines">
        <div class="ln" id="l1">שיחה אחת.</div>
        <div class="ln" id="l2">רגע אחד של חוסר תשומת לב.</div>
        <div class="ln ln--3" id="l3">מידע שלא היה אמור להיחשף.</div>
      </div>
      <div class="sign" id="sign">המשמר הדיגיטלי<small>ערנות אנושית לשיחות וידאו חיות</small></div>
    </div>
    <script>
      const clamp = (x) => Math.min(1, Math.max(0, x));
      const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
      const seg = (t, a, b) => ease((t - a) / (b - a));
      const $ = (id) => document.getElementById(id);
      function reveal(el, t, a) {
        const k = seg(t, a, a + 0.7);
        el.style.opacity = k;
        el.style.transform = `translateY(${(1 - k) * 24}px)`;
      }
      window.render = (t) => {
        reveal($('l1'), t, 0.3);
        reveal($('l2'), t, 1.4);
        reveal($('l3'), t, 2.7);
        const callK = seg(t, 0, 0.8);
        document.querySelector('.call').style.opacity = callK;
        ['t1', 't2', 't3'].forEach((id, i) => {
          $(id).style.opacity = seg(t, 1.0 + i * 0.3, 1.5 + i * 0.3);
        });
        // protection arrives: a ring expands and covers the exposed tags
        const r = seg(t, 4.2, 5.4);
        $('ring').style.width = $('ring').style.height = `${r * 760}px`;
        $('ring').style.opacity = r === 0 ? 0 : 1 - seg(t, 5.0, 5.6);
        ['t1', 't2', 't3'].forEach((id, i) => {
          $(id).querySelector('.cover').style.transform = `scaleX(${seg(t, 4.6 + i * 0.25, 5.1 + i * 0.25)})`;
        });
        $('emblem').style.opacity = seg(t, 5.2, 5.9);
        const s = seg(t, 5.6, 6.4);
        $('sign').style.opacity = s;
        $('sign').style.transform = `translateY(${(1 - s) * 20}px)`;
        [$('l1'), $('l2'), $('l3')].forEach((el) => {
          el.style.opacity = Number(el.style.opacity) * (1 - 0.35 * seg(t, 5.6, 6.2));
        });
      };
      window.render(0);
    </script>
  </body>
</html>
