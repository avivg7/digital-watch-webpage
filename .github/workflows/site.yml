name: site

# Builds, checks and (from main only) publishes the static site to GitHub Pages.
# Nothing here needs a secret. The deploy job runs only after every check passes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint, format and type check
        run: |
          npm run lint
          npm run format:check
          npm run check
      - name: Dependency audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      - name: Publication gate (file types, metadata, private paths, contacts)
        run: npm run verify:public
      - name: Browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Tests (Chromium, Firefox, WebKit engine, two phone profiles)
        run: npx playwright test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Keep the test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: test-results
          retention-days: 3

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
